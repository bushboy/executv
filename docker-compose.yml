# ExecuTV docker stack talks to the host PostgreSQL (not a compose Postgres service).
# From containers, the host is host.docker.internal.

name: executv

services:
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: executv_seed
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["executv-seed"]
    restart: "no"

  core_engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: executv_core_engine
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CORE_ENGINE_HOST: 0.0.0.0
      CORE_ENGINE_PORT: 8001
    command: ["uvicorn", "core_engine.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ingress_gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: executv_ingress
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INGRESS_GATEWAY_HOST: 0.0.0.0
      INGRESS_GATEWAY_PORT: 8000
      CORE_ENGINE_URL: http://core_engine:8001
    command: ["uvicorn", "ingress_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      core_engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  visual_display:
    build:
      context: ./apps/visual_display_adapter
      dockerfile: Dockerfile
      args:
        VITE_CORE_ENGINE_URL: ${VITE_CORE_ENGINE_URL:-http://localhost:8001}
        VITE_INGRESS_GATEWAY_URL: ${VITE_INGRESS_GATEWAY_URL:-http://localhost:8000}
    container_name: executv_visual_display
    ports:
      - "5173:80"
    depends_on:
      ingress_gateway:
        condition: service_healthy
    restart: unless-stopped
