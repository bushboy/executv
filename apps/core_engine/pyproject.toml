[project]
name = "core-engine"
version = "0.1.0"
description = "FastAPI orchestration API and Dual-Payload Formatter for ExecuTV"
requires-python = ">=3.12"
dependencies = [
  "core-data-layer",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.0",
  "boto3>=1.35.0",
]

[project.scripts]
executv-core-engine = "core_engine.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.uv.sources]
core-data-layer = { workspace = true }
