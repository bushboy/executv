[project]
name = "ingress-gateway"
version = "0.1.0"
description = "FastAPI MCP Streamable HTTP server and SSE tool ticker for ExecuTV"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "mcp>=2.2.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
executv-ingress = "ingress_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]
